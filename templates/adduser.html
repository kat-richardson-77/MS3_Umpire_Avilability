
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register | Umpire Availability</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">
    <main class="container py-5" style="max-width: 480px">
        <div class="card shadow-sm border-0 rounded-4 p-4">
            <h1 class="h3 mb-2">Create your account</h1>
            <p class="text-secondary">Join Umpire Availability.</p>

            {% with messages = get_flashed_messages() %}
                {% for message in messages %}
                    <div class="alert alert-danger">{{ message }}</div>
                {% endfor %}
            {% endwith %}

            <form method="post" action="{{ url_for('register') }}">
                <div class="mb-3">
                    <label for="email" class="form-label">Email address</label>
                    <input id="email" name="email" type="email"
                           class="form-control" autocomplete="email" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input id="password" name="password" type="password"
                           class="form-control" minlength="12"
                           autocomplete="new-password" required>
                    <small class="text-secondary">
                        Use at least 12 characters.
                    </small>
                </div>

                <button class="btn btn-primary w-100" type="submit">
                    Register
                </button>
            </form>

            <p class="mt-3 mb-0">
                Already registered?
                <a href="{{ url_for('login') }}">Sign in</a>
            </p>
        </div>
    </main>
</body>
</html>
