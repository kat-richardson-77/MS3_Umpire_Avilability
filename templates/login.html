<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Umpire Availability | Sign In</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #04376b, #071d3a);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .login-container {
            width: 100%;
            max-width: 460px;
        }

        .brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: #fff;
        }

        .brand p {
            color: #c5d5e8;
            font-size: 0.9rem;
            margin: 0;
        }

        .login-card {
            background: #fff;
            color: #1d2939;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
        }

        .login-card h2 {
            font-size: 1.7rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .login-subtitle {
            color: #667085;
            font-size: 0.9rem;
            margin-bottom: 28px;
        }

        .form-label {
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .form-control {
            min-height: 50px;
            border: 1px solid #d0d5dd;
            border-radius: 10px;
            padding: 12px 14px;
            font-family: inherit;
            font-size: 0.9rem;
            color: #1d2939;
            background-color: #fff;
        }

        .form-control:focus {
            border-color: #1769aa;
            box-shadow: 0 0 0 3px rgba(23, 105, 170, 0.15);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
            font-size: 0.82rem;
        }

        .form-check {
            display: flex;
            align-items: center;
            gap: 8px;
            padding-left: 0;
        }

        .form-check-input {
            float: none;
            margin: 0;
            cursor: pointer;
        }

        .form-check-label {
            cursor: pointer;
        }

        a {
            color: #075ca8;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .btn-submit {
            width: 100%;
            min-height: 50px;
            border: none;
            border-radius: 10px;
            background: #075ca8;
            color: #fff;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s ease,
                        transform 0.2s ease;
        }

        .btn-submit:hover {
            background: #043f78;
            transform: translateY(-1px);
        }

        .signup-text {
            margin: 24px 0 0;
            text-align: center;
            font-size: 0.85rem;
            color: #667085;
        }

        .signup-text a {
            font-weight: 600;
        }

        .footer-text {
            text-align: center;
            color: #c5d5e8;
            font-size: 0.75rem;
            margin-top: 24px;
        }

        @media (max-width: 480px) {
            body {
                padding: 18px;
            }

            .login-card {
                padding: 28px 22px;
                border-radius: 16px;
            }

            .brand h1 {
                font-size: 1.5rem;
            }

            .login-card h2 {
                font-size: 1.45rem;
            }
        }
    </style>
</head>

<body>

    <main class="login-container">

        <header class="brand">
            <h1>Umpire Availability</h1>
            <p>Manage your umpiring schedule with ease</p>
        </header>

        <section class="login-card" aria-labelledby="login-heading">

            <h2 id="login-heading">Welcome back</h2>
            <p class="login-subtitle">
                Sign in to access your account.
            </p>

            <form action="{{ url_for('login') }}" method="post">

                <div class="form-group">
                    <label for="email" class="form-label">
                        Email address
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">
                        Password
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <div class="form-options">

                    <div class="form-check">
                        <input
                            type="checkbox"
                            class="form-check-input"
                            id="rememberme"
                            name="rememberme"
                        >

                        <label
                            for="rememberme"
                            class="form-check-label"
                        >
                            Remember me
                        </label>
                    </div>

                    <a href="forgot-password.html">
                        Forgot password?
                    </a>

                </div>

                <button type="submit" class="btn-submit">
                    Sign in
                </button>

                <p class="signup-text">
                    Haven't registered for an account yet
